{{- if .Values.policies.spiffeHelperNonRoot.enabled }}
# Sets a non-root securityContext on any container named "spiffe-helper", wherever it appears
# in a Pod (initContainers - the native-sidecar placement ITL.Openproject.fork and the cofide
# spiffe-enable injector both use - or plain containers). Without this, spiffe-helper runs as
# root by default and writes tls.key as 0600 root:root, unreadable by any application container
# that runs as a non-root uid - confirmed live against ITL.Openproject.fork
# (docs/5-authentication/5.3-spiffe-mtls-postgres.md in that repo): the symptom is
# "PG::ConnectionBad: ... requires a valid client certificate" even with the file physically
# present and mounted, since the consuming library silently skips a certificate it can't read
# rather than erroring on the missing permission.
#
# Uses mutate.foreach, not a top-level precondition filtering spec.initContainers/spec.containers
# directly - confirmed live (2026-10-29): a precondition like
# "length(request.object.spec.initContainers[?name=='spiffe-helper']) > 0" throws a JMESPath
# error ("Invalid type for: <nil>") for any pod that has no initContainers at all (the field is
# then null, not an empty array), and with this policy's failurePolicy=Fail, that error BLOCKED
# ADMISSION of every such pod cluster-wide - most pods, since initContainers is optional and
# commonly absent. foreach over a null/absent list is a documented no-op in Kyverno, which is
# what actually makes this policy safe to run as a blanket ClusterPolicy.
#
# Cluster-wide and app-agnostic on purpose - this is the whole point of moving the fix here
# instead of patching every chart that uses SPIFFE workload identity individually. The uid/gid
# below must match whatever uid the consuming application's own containers run as (this
# cluster's charts standardise on 1000 - ITL.Openproject.fork, the Bitnami-pattern charts
# generally) for the files to actually be group-readable once written.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: spiffe-helper-nonroot
  annotations:
    policies.kyverno.io/title: SPIFFE Helper Non-Root
    policies.kyverno.io/category: SPIFFE / Workload Identity
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Mutates any container named "spiffe-helper" (initContainers or containers) to run as
      {{ .Values.policies.spiffeHelperNonRoot.uid }}:{{ .Values.policies.spiffeHelperNonRoot.gid }}
      instead of its root default, so the SVID files it writes are readable by application
      containers running as that same non-root uid.
spec:
  # Ignore, not Fail: confirmed live (2026-10-29) that a JMESPath error in this policy - over an
  # optional field like initContainers, entirely absent from the admission request JSON for most
  # pods rather than merely null - blocks admission of every pod matching the rule's `match`
  # block, cluster-wide, with failurePolicy: Fail (Kyverno's own default). Ignore degrades a
  # future bug in this policy to "mutation silently skipped", not "cluster-wide pod creation
  # outage" - a correctness bug here should never be able to take down the whole cluster.
  failurePolicy: Ignore
  rules:
    - name: set-securitycontext-init
      match:
        any:
          - resources:
              kinds:
                - Pod
      mutate:
        foreach:
          - list: "request.object.spec.initContainers || []"
            preconditions:
              all:
                - key: "{{ `{{ element.name }}` }}"
                  operator: Equals
                  value: "spiffe-helper"
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ `{{ element.name }}` }}"
                    securityContext:
                      runAsUser: {{ .Values.policies.spiffeHelperNonRoot.uid }}
                      runAsGroup: {{ .Values.policies.spiffeHelperNonRoot.gid }}
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault

    - name: set-securitycontext-container
      match:
        any:
          - resources:
              kinds:
                - Pod
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ `{{ element.name }}` }}"
                  operator: Equals
                  value: "spiffe-helper"
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ `{{ element.name }}` }}"
                    securityContext:
                      runAsUser: {{ .Values.policies.spiffeHelperNonRoot.uid }}
                      runAsGroup: {{ .Values.policies.spiffeHelperNonRoot.gid }}
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
{{- end }}
